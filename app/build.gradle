apply plugin: 'com.android.application'

android {
    namespace 'hu.szorzo.forintidogep'
    compileSdk 34

    defaultConfig {
        applicationId "hu.szorzo.forintidogep"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
